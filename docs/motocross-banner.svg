<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="50%" stop-color="#101722"/>
      <stop offset="100%" stop-color="#090D14"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6600"/>
      <stop offset="65%" stop-color="#FF2A00"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="360" rx="22" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Racing Telemetry Grid -->
  <g stroke="#162032" stroke-width="1" opacity="0.65">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Top Shift-Light LED Array -->
  <g transform="translate(410, 22)">
    <rect x="0" y="0" width="38" height="10" rx="3" fill="#00E676"/>
    <rect x="48" y="0" width="38" height="10" rx="3" fill="#00E676"/>
    <rect x="96" y="0" width="38" height="10" rx="3" fill="#00E676"/>
    <rect x="144" y="0" width="38" height="10" rx="3" fill="#FFD600"/>
    <rect x="192" y="0" width="38" height="10" rx="3" fill="#FFD600"/>
    <rect x="240" y="0" width="38" height="10" rx="3" fill="#FF6600"/>
    <rect x="288" y="0" width="38" height="10" rx="3" fill="#FF1744" filter="url(#glow)"/>
    <rect x="336" y="0" width="38" height="10" rx="3" fill="#FF1744" filter="url(#glow)"/>
  </g>

  <!-- Left OEM Tachometer Dial Graphic -->
  <g transform="translate(195, 190)">
    <circle cx="0" cy="0" r="130" fill="#0B0F17" stroke="#263244" stroke-width="4"/>
    <!-- RPM Track Arc -->
    <path d="M -92 92 A 130 130 0 1 1 112 -65" fill="none" stroke="#1E293B" stroke-width="16" stroke-linecap="round"/>
    <!-- Active Cyan/Orange Sweep -->
    <path d="M -92 92 A 130 130 0 1 1 65 -112" fill="none" stroke="url(#orangeGlow)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Redline Zone -->
    <path d="M 65 -112 A 130 130 0 0 1 122 45" fill="none" stroke="#FF1744" stroke-width="16" stroke-linecap="round"/>
    <!-- Needle -->
    <line x1="0" y1="0" x2="72" y2="-92" stroke="#FF9100" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="18" fill="#1E293B" stroke="#FF6600" stroke-width="4"/>
    <!-- Gear Indicator & Speed inside Dial -->
    <text x="0" y="48" font-family="monospace, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle">299</text>
    <text x="0" y="68" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="middle">KM/H • GEAR 6</text>
    <text x="0" y="-42" font-family="monospace, sans-serif" font-size="22" font-weight="900" fill="#00E676" text-anchor="middle">MX</text>
  </g>

  <!-- Center Brand Title & Engineering Subtitle -->
  <g transform="translate(375, 115)">
    <rect x="0" y="-36" width="215" height="26" rx="6" fill="#FF6600" opacity="0.18"/>
    <text x="12" y="-18" font-family="monospace, sans-serif" font-size="13" font-weight="800" fill="#FF6600" letter-spacing="1.5">OEM-CLUSTER PRO ENGINE</text>

    <text x="0" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" fill="#FFFFFF" letter-spacing="-1">Moto<tspan fill="#FF6600">Cross</tspan></text>

    <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#CBD5E1">
      105 Factory Motorcycle Instrument Clusters • C++20 400 Hz EKF • Virtual ECU
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#131C2B" stroke="#FF6600" stroke-width="1.5"/>
      <text x="82" y="22" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">105 OEM CLUSTERS</text>

      <rect x="178" y="0" width="175" height="34" rx="8" fill="#131C2B" stroke="#00E5FF" stroke-width="1.5"/>
      <text x="265" y="22" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#00E5FF" text-anchor="middle">400 Hz 15-STATE EKF</text>

      <rect x="366" y="0" width="185" height="34" rx="8" fill="#131C2B" stroke="#00E676" stroke-width="1.5"/>
      <text x="458" y="22" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#00E676" text-anchor="middle">48 kHz ACOUSTIC FFT</text>

      <rect x="564" y="0" width="210" height="34" rx="8" fill="#131C2B" stroke="#FFD600" stroke-width="1.5"/>
      <text x="669" y="22" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#FFD600" text-anchor="middle">WHEELIE METER (°/S/M)</text>
    </g>

    <!-- Bottom Telemetry Readout Bar -->
    <g transform="translate(0, 162)">
      <text x="0" y="18" font-family="monospace, sans-serif" font-size="14" font-weight="700" fill="#94A3B8">
        LEAN: <tspan fill="#00E5FF">44.2°</tspan>   |   WHEELIE: <tspan fill="#FFD600">38.5° (4.6s • 92m)</tspan>   |   RENDER: <tspan fill="#00E676">120 FPS</tspan>   |   I18N: <tspan fill="#FFFFFF">9 LANGUAGES</tspan>
      </text>
    </g>
  </g>
</svg>
